<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="nav wrap"><a class="logo" href="index.html">EMI<span>Store</span></a></div></header><main class="section wrap"><h1>Your Cart</h1><div id="cart"></div></main><script>const all=[['Nova X Pro 5G',29999,'📱'],['AirBook 14 Laptop',54999,'💻'],['Vision 55 Smart TV',39999,'📺'],['SoundPods Pro',4999,'🎧'],['FitWatch Ultra',7999,'⌚'],['CoolHome 1.5T AC',32999,'❄️'],['PowerPhone Lite',14999,'📱'],['GameBook 15',69999,'💻']];let ids=JSON.parse(localStorage.getItem('cart')||'[]');cart.innerHTML=ids.length?ids.map(i=>{let p=all[i-1];return '<div class="card" style="margin-bottom:12px"><h3>'+p[2]+' '+p[0]+'</h3><b>₹'+p[1].toLocaleString('en-IN')+'</b><a class="btn primary" style="margin-left:12px" href="emi-application.html?id='+i+'">Buy on EMI</a></div>'}).join(''):'<p>Your cart is empty.</p>'</script></body></html>
