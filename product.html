<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products – Nova Cart</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --primary: #6C3CE1;
            --primary-dark: #5A2FC4;
            --primary-light: #8B6BE8;
            --secondary: #00C9A7;
            --danger: #FF4757;
            --warning: #FFA502;
            --success: #2ED573;
            --dark: #0A0A1A;
            --dark-card: #12122A;
            --text-light: #FFFFFF;
            --text-muted: #A0A0B8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-light);
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ===== GLASSMORPHISM ===== */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
        }

        /* ===== NAVBAR ===== */
        .navbar {
            padding: 16px 0;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .navbar.scrolled {
            background: rgba(10, 10, 26, 0.98);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-light);
            text-decoration: none;
        }

        .logo-text .highlight {
            color: var(--primary);
        }

        .logo-icon {
            color: var(--primary);
            font-size: 28px;
            margin-right: 10px;
        }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 8px 20px !important;
            border-radius: 10px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text-light) !important;
            background: rgba(108, 60, 225, 0.15);
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: #fff;
            padding: 10px 28px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 60, 225, 0.4);
            color: #fff;
        }

        .btn-outline-custom {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            padding: 10px 28px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-block;
        }

        .btn-outline-custom:hover {
            border-color: var(--primary);
            color: var(--text-light);
            background: rgba(108, 60, 225, 0.1);
        }

        /* ===== PRODUCTS HERO ===== */
        .products-hero {
            padding: 140px 0 40px;
            background: radial-gradient(ellipse at 50% 30%, rgba(108,60,225,0.1), transparent 70%), var(--dark);
        }

        .hero-badge {
            display: inline-block;
            background: rgba(108, 60, 225, 0.15);
            border: 1px solid rgba(108, 60, 225, 0.3);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 14px;
            color: var(--primary-light);
            margin-bottom: 20px;
        }

        .text-gradient {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== PRODUCT CARD ===== */
        .product-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: rgba(108, 60, 225, 0.3);
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.1);
        }

        .product-card .product-image {
            width: 100%;
            height: 180px;
            background: var(--glass-bg);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            color: var(--text-muted);
            margin-bottom: 16px;
            border: 1px solid var(--glass-border);
        }

        .product-card .product-name {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .product-card .product-brand {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .product-card .product-price {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-light);
        }

        .product-card .product-price .original {
            font-size: 16px;
            color: var(--text-muted);
            text-decoration: line-through;
            font-weight: 400;
            margin-left: 8px;
        }

        .product-card .product-discount {
            color: var(--success);
            font-weight: 600;
            font-size: 14px;
        }

        .product-card .product-emi {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .product-card .product-emi strong {
            color: var(--primary-light);
        }

        .product-card .product-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
            flex-wrap: wrap;
        }

        .product-card .product-actions .btn-sm-custom {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            text-decoration: none;
            display: inline-block;
            flex: 1;
            text-align: center;
        }

        .btn-emi {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
        }

        .btn-emi:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 60, 225, 0.4);
            color: #fff;
        }

        .btn-wishlist {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
        }

        .btn-wishlist:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(255, 71, 87, 0.1);
        }

        .btn-compare {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
        }

        .btn-compare:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(108, 60, 225, 0.1);
        }

        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--danger);
            color: #fff;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
        }

        .product-card {
            position: relative;
        }

        .product-stock {
            font-size: 13px;
            font-weight: 500;
        }

        .product-stock.in-stock {
            color: var(--success);
        }

        .product-stock.out-of-stock {
            color: var(--danger);
        }

        /* ===== SEARCH BAR ===== */
        .search-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 60, 225, 0.2);
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-light);
            width: 100%;
            font-size: 16px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box i {
            color: var(--text-muted);
            font-size: 18px;
        }

        /* ===== FILTERS ===== */
        .filter-group {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }

        .filter-group h6 {
            font-weight: 700;
            margin-bottom: 12px;
        }

        .filter-group .form-check {
            margin-bottom: 6px;
        }

        .filter-group .form-check-label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .filter-group .form-check-input {
            background-color: var(--glass-bg);
            border: 1px solid var(--glass-border);
        }

        .filter-group .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        /* ===== SECTION TITLES ===== */
        .section-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .section-title .highlight {
            color: var(--primary);
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 18px;
            margin-bottom: 40px;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 60px 0 30px;
            margin-top: 60px;
        }

        .footer h5 {
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-light);
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: block;
            padding: 4px 0;
        }

        .footer a:hover {
            color: var(--text-light);
        }

        .social-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-right: 10px;
            font-size: 18px;
        }

        .social-icon:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(108, 60, 225, 0.3);
        }

        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ===== MOBILE BOTTOM NAV ===== */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 0 env(safe-area-inset-bottom, 0);
        }

        .mobile-bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            padding: 4px 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .mobile-bottom-nav .nav-item i {
            font-size: 22px;
            margin-bottom: 2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mobile-bottom-nav .nav-item.active {
            color: var(--primary);
        }

        .mobile-bottom-nav .nav-item.active i {
            transform: translateY(-2px);
        }

        .mobile-bottom-nav .nav-item .badge-count {
            position: absolute;
            top: -2px;
            right: 50%;
            transform: translateX(28px);
            background: var(--danger);
            color: #fff;
            font-size: 10px;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 991px) {
            .section-title {
                font-size: 30px;
            }
            .section-subtitle {
                font-size: 16px;
            }
        }

        @media (max-width: 768px) {
            .mobile-bottom-nav {
                display: flex !important;
            }
            .section-title {
                font-size: 26px;
            }
            .section-subtitle {
                font-size: 15px;
                margin-bottom: 30px;
            }
            .product-card .product-image {
                height: 140px;
                font-size: 48px;
            }
            .product-card .product-name {
                font-size: 16px;
            }
            .product-card .product-price {
                font-size: 18px;
            }
            .products-hero {
                padding: 120px 0 30px;
            }
            .filter-group {
                padding: 16px;
            }
        }

        @media (max-width: 576px) {
            .section-title {
                font-size: 22px;
            }
            .products-hero h1 {
                font-size: 28px;
            }
            .btn-primary-custom,
            .btn-outline-custom {
                padding: 8px 20px;
                font-size: 14px;
            }
            .footer {
                padding: 40px 0 20px;
            }
            .product-card {
                padding: 14px;
            }
            .product-card .product-image {
                height: 120px;
                font-size: 36px;
            }
        }

        @media (min-width: 769px) {
            .mobile-bottom-nav {
                display: none !important;
            }
        }
    </style>
</head>
