<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav wrap"><a class="logo" href="index.html">EMI<span>Store</span> Admin</a></div></header><main class="section wrap"><p class="eyebrow">ADMIN</p><h1>Operations Dashboard</h1><div class="infoGrid"><div class="info"><b>0</b><h3>Applications</h3><p>Pending EMI applications.</p></div><div class="info"><b>0</b><h3>Orders</h3><p>Orders requiring action.</p></div><div class="info"><b>0</b><h3>Customers</h3><p>Customer accounts.</p></div></div><div class="card"><h2>Application review</h2><div id="app"></div></div></main><script>let a=JSON.parse(localStorage.getItem('emiApplication')||'null');document.querySelector('#app').innerHTML=a?'<p><b>'+a.name+'</b> — '+a.mobile+'</p><p>Status: <b>'+a.status+'</b></p><button class="btn primary" onclick="approve()">Approve demo</button> <button class="btn secondary" onclick="reject()">Reject demo</button>':'<p>No demo applications found.</p>';function approve(){a.status='Approved';localStorage.setItem('emiApplication',JSON.stringify(a));location.reload()}function reject(){a.status='Rejected';localStorage.setItem('emiApplication',JSON.stringify(a));location.reload()}</script></body></html>
