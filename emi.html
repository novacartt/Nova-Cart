<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMI Calculator</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="nav wrap"><a class="logo" href="index.html">EMI<span>Store</span></a><nav><a href="index.html">Home</a><a href="emi.html">EMI Calculator</a><a href="account.html">Account</a></nav></div></header><main class="section wrap"><div class="card" style="max-width:720px;margin:auto"><p class="eyebrow">EMI CALCULATOR</p><h1>Plan your monthly payment</h1><label>Product price</label><input id="price" type="number" value="30000"><label>Down payment (%)</label><input id="down" type="number" value="20" min="20" max="100"><label>Tenure</label><select id="months"><option>3</option><option>6</option><option>9</option><option selected>12</option><option>18</option><option>24</option></select><label>Flat interest rate (% yearly)</label><input id="rate" type="number" value="10"><div id="result" class="info" style="margin-top:18px"></div><a class="btn primary" href="emi-application.html">Continue with EMI</a></div></main><script>function calc(){let p=+price.value||0,d=+down.value||20,m=+months.value||12,r=+rate.value||0;let dp=p*d/100,loan=p-dp,interest=loan*r/100, total=loan+interest,emi=total/m;result.innerHTML='<h3>Estimated breakdown</h3><p>Product: <b>₹'+p.toLocaleString('en-IN')+'</b></p><p>Down payment: <b>₹'+dp.toLocaleString('en-IN')+'</b></p><p>Financed amount: <b>₹'+loan.toLocaleString('en-IN')+'</b></p><p>Illustrative interest: <b>₹'+interest.toLocaleString('en-IN')+'</b></p><p>Total financed repayment: <b>₹'+total.toLocaleString('en-IN')+'</b></p><h2>₹'+emi.toFixed(2).toLocaleString('en-IN')+' / month</h2><small class="muted">Illustrative only; actual lender terms may differ.</small>'}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',calc));calc();</script></body></html>
