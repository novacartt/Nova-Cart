<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMI Application</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="nav wrap"><a class="logo" href="index.html">EMI<span>Store</span></a></div></header><main class="section wrap"><form id="appForm" class="card" style="max-width:850px;margin:auto"><p class="eyebrow">EMI APPLICATION</p><h1>Customer details</h1><p class="muted">This demo collects application fields locally. Connect a compliant KYC/financing provider before production.</p><div class="formGrid"><input required name="name" placeholder="Full name"><input required name="mobile" placeholder="Mobile number"><input name="email" type="email" placeholder="Email"><input name="dob" type="date"><input name="pan" placeholder="PAN number"><input name="aadhaar" placeholder="Aadhaar number"><input name="income" type="number" placeholder="Monthly income"><input name="occupation" placeholder="Occupation"><textarea name="address" placeholder="Full address"></textarea><input name="aadhaarFront" type="file" accept="image/*,.pdf"><input name="aadhaarBack" type="file" accept="image/*,.pdf"><input name="panFile" type="file" accept="image/*,.pdf"><button type="button" class="btn secondary" id="selfieBtn">Capture Live Selfie</button><div id="cameraBox"></div><input name="brotherName" placeholder="Emergency reference — Brother name"><input name="brotherMobile" placeholder="Brother mobile"><input name="parentName" placeholder="Parent name"><input name="parentMobile" placeholder="Parent mobile"><input name="friendName" placeholder="Friend name"><input name="friendMobile" placeholder="Friend mobile"><textarea name="bank" placeholder="Bank details (optional)"></textarea></div><label class="consent"><input type="checkbox" required> I consent to processing of my information for this application and agree to the applicable terms.</label><button class="btn primary" type="submit">Submit EMI Application</button><div id="status"></div></form></main><script>const f=document.querySelector('#appForm');document.querySelector('#selfieBtn').onclick=async()=>{try{let s=await navigator.mediaDevices.getUserMedia({video:true});let v=document.createElement('video');v.autoplay=true;v.srcObject=s;v.style.width='100%';v.style.maxWidth='400px';document.querySelector('#cameraBox').replaceChildren(v);setTimeout(()=>{s.getTracks().forEach(t=>t.stop());},5000)}catch(e){alert('Camera permission was not granted.')}};f.onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(f).entries());delete data.aadhaarFront;delete data.aadhaarBack;delete data.panFile;localStorage.setItem('emiApplication',JSON.stringify({...data,status:'Submitted',createdAt:new Date().toISOString()}));document.querySelector('#status').innerHTML='<div class="info"><h3>Application submitted</h3><p>Your demo application ID is <b>EMI-'+Date.now().toString().slice(-8)+'</b>. Status: Pending review.</p></div>';f.reset()};</script></body></html>
